name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: vvvv

      - name: Publish
        run: ./build.ps1 Publish
        env:
          NuGetApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}